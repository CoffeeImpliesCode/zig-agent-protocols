# Continuous integration for zig-agent-proto.
#
# This runs the half of the house gate that a pinned Zig toolchain can
# reproduce on any machine: `zig fmt --check`, `zig build`, `zig build test` in
# Debug and again in ReleaseSafe, `zig ast-check`, `zig build fuzz`, `zig build
# docs`, and the five live examples — `run`, `run-runtime`, `run-sessions`,
# `run-http` and `run-a2a` — beside one bounded `run-bench` smoke. The
# developer's `gate` script also runs zlint and zbc, but those are builds of
# personal checkouts under `~/tools`, not dependencies of this repository, so
# CI cannot run them without vendoring an unpinned third-party build. A lint
# gate that only exists on one machine is not a gate; those two stay a
# developer-side check.
#
# The two interoperability participants are built and installed here, because
# they are executables of this repository, and they are not driven here. Their
# peers are pinned Python SDKs declared in `devenv.nix` and read at run time
# from a pin file; reproducing that environment on a runner would mean
# installing third-party packages this workflow does not pin, which is the
# thing the rest of this file refuses to do. Those exchanges are run where the
# SDK is declared, and the report they produce is checked against captured
# wire bytes.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The gate reads the source and nothing else.
permissions:
  contents: read

# A superseded push on the same ref is dead work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Both runners execute natively. The library has no system library
    # dependencies, so a native run on Linux and on macOS is a real
    # portability check. A cross-compile matrix would only prove that
    # `zig build -Dtarget=...` emits objects that nothing ever runs.
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One runner's failure must not hide the other runner's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      # CI owns both caches, in the checkout, and names them here rather than
      # inheriting an answer from elsewhere. `devenv.nix` deliberately puts a
      # developer's caches on approved per-account scratch mounts outside the
      # checkout — node-local physical volumes first, approved NFS as a
      # fallback — because a build is fast there and a rename survives, and
      # because the interoperability peers refuse a shared temporary
      # directory by name. So there is no shared layout to match on purpose:
      # a cache written by a developer belongs to that machine's scratch
      # root, and restoring it here would write to a path no step of this
      # job should use. This one is the runner's.
      ZIG_GLOBAL_CACHE_DIR: .zig-global-cache
      # The local cache beside the global one, named rather than left to zig's
      # `$PWD/.zig-cache` default so the directory this workflow creates, the
      # directory `actions/cache` saves, and the directory the toolchain
      # writes are the same one by construction.
      ZIG_LOCAL_CACHE_DIR: .zig-cache

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Every socket this build binds and every temporary file the toolchain
      # writes belongs to this job, in a directory the runner owns and empties
      # between jobs. `$RUNNER_TEMP` is that directory on both runners here and
      # is neither `/tmp` nor `/var/tmp` on either of them; the socket names are
      # rendered out of `TMPDIR` and refuse a directory the machine shares with
      # every other user, so a step that did not set it would fail later, inside
      # a test, with the reason two steps away.
      #
      # The Zig caches are named in the `env` block above and are created here
      # too, before the toolchain download rather than by whichever step first
      # needs them, so a cache save restores into a directory that exists.
      - name: Initialize this job's temporary and cache directories
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/zig-agent-proto/tmp"
          case "$scratch" in
            /tmp | /tmp/* | /var/tmp | /var/tmp/*)
              echo "RUNNER_TEMP resolved to the system temporary directory: $scratch" >&2
              exit 1
              ;;
          esac
          mkdir -p "$scratch" "$ZIG_LOCAL_CACHE_DIR" "$ZIG_GLOBAL_CACHE_DIR"
          echo "temporary area: $scratch"
          # TMP and TEMP are read by nothing here, but a tool the build invokes
          # may read either, and leaving one of them pointing at a system
          # directory while the other points here is worse than setting all
          # three to the same answer.
          {
            echo "TMPDIR=$scratch"
            echo "TMP=$scratch"
            echo "TEMP=$scratch"
          } >> "$GITHUB_ENV"

      - name: Restore the Zig caches
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            .zig-global-cache
          # The manifest is the key because it carries the toolchain pin and
          # the dependency set. Source contents are not part of the key:
          # Zig hashes them itself, so an edit under `src/` reuses this cache
          # and rebuilds only what changed. The restore key stays inside one
          # runner OS, because a cache entry holds native objects.
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-

      - name: Install the pinned Zig toolchain
        run: |
          set -euo pipefail
          # The version is read from the manifest, never copied into this
          # file. `.minimum_zig_version` is the one place the toolchain
          # version is written down; this workflow, the anyzig shim, and
          # `gate` all read it, so none of them can drift from each other.
          version="$(sed -n 's/.*\.minimum_zig_version = "\(.*\)".*/\1/p' build.zig.zon)"
          if [ -z "$version" ]; then
            echo "build.zig.zon declares no .minimum_zig_version" >&2
            exit 1
          fi

          case "$(uname -s)" in
            Linux) os=linux ;;
            Darwin) os=macos ;;
            *) echo "unsupported runner os $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64 | amd64) arch=x86_64 ;;
            arm64 | aarch64) arch=aarch64 ;;
            *) echo "unsupported runner arch $(uname -m)" >&2; exit 1 ;;
          esac
          target="$arch-$os"

          # ziglang.org is the only download source here, and its index
          # carries the sha256 of every tarball it publishes. A "latest"
          # tarball URL would let a toolchain swap silently change what CI
          # proves; a missing release is a loud failure instead.
          index="$(curl --fail --silent --show-error --location \
            https://ziglang.org/download/index.json)"
          url="$(printf '%s' "$index" |
            jq -er --arg v "$version" --arg t "$target" '.[$v][$t].tarball')" || {
            echo "zig $version publishes no $target tarball" >&2
            exit 1
          }
          expected="$(printf '%s' "$index" |
            jq -er --arg v "$version" --arg t "$target" '.[$v][$t].shasum')"

          archive="$RUNNER_TEMP/zig.tar.xz"
          curl --fail --silent --show-error --location --output "$archive" "$url"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          else
            actual="$(shasum -a 256 "$archive" | cut -d' ' -f1)"
          fi
          if [ "$actual" != "$expected" ]; then
            echo "sha256 mismatch for $url" >&2
            echo "  index says $expected" >&2
            echo "  download  $actual" >&2
            exit 1
          fi

          # The tarball's root directory is named after the target, and that
          # name is not guaranteed to match what `uname` reports, so strip
          # it instead of guessing it.
          prefix="$RUNNER_TEMP/zig"
          mkdir -p "$prefix"
          tar -xf "$archive" -C "$prefix" --strip-components=1
          echo "$prefix" >> "$GITHUB_PATH"
          "$prefix/zig" version

      # The first thing `gate` does on a developer machine. It is worth
      # repeating here: every later step is meaningless against a toolchain
      # the manifest does not describe.
      - name: Cross-check the toolchain against the manifest pin
        run: |
          set -eu
          version="$(zig version)"
          pin="$(sed -n 's/.*\.minimum_zig_version = "\(.*\)".*/\1/p' build.zig.zon)"
          test "$version" = "$pin" || {
            echo "zig $version does not match .minimum_zig_version $pin" >&2
            exit 1
          }
          echo "zig $version matches .minimum_zig_version"

      - name: zig fmt --check
        run: zig fmt --check .

      - name: zig build
        run: zig build

      - name: zig build test
        run: zig build test

      # Decoders here index caller-owned buffers by offsets the tests
      # compute. Debug mode lets an out-of-range index wrap or pass, so the
      # second pass is the one that would catch it.
      - name: zig build test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

      - name: zig ast-check
        run: |
          set -euo pipefail
          # The file set the manifest publishes in `.paths`: the build script
          # and the sources. Nothing else in a checkout is Zig, and a
          # restored cache must not widen the set.
          find build.zig src test -name '*.zig' -print | while IFS= read -r f; do
            zig ast-check "$f"
          done

      # Exercise the decoders on real wire bytes, not just inside unit tests.
      # The demonstration writes its report to stdout.
      - name: zig build run
        run: zig build run

      # The property and differential harness is the only check that survives
      # an input nobody hand-wrote, so a build without it is a build that only
      # proves what it already assumed. It runs in Debug, where an
      # out-of-bounds index is a trap, and the default seed is fixed so a
      # failure on CI is reproducible from the log.
      - name: zig build fuzz
        run: zig build fuzz

      # The runtime layer's end-to-end proof: a real client and a real server
      # exchanging frames over a real socket. Without it, CI would only ever
      # prove the codec works against slices.
      - name: zig build run-runtime
        run: zig build run-runtime

      # The ACP session and the mcp-over-acp binding over one real
      # connection. An inner MCP error arrives inside a successful outer
      # response, and only a transport shows that it stays that way.
      - name: zig build run-sessions
        run: zig build run-sessions

      # The Streamable HTTP transport over a real loopback socket, answering
      # one POST with a single JSON body and one with an event stream.
      - name: zig build run-http
        run: zig build run-http

      # The A2A 1.0 unary slice over a real socket: an Agent Card discovered
      # from an origin, a `SendMessage` answered with a task, one answered with
      # a message, and one refused. It is the only place the A2A codec is
      # driven by something other than literals.
      - name: zig build run-a2a
        run: zig build run-a2a

      # The benchmark driver, sized small. This is a smoke and not a
      # performance gate: it proves the driver's own refusals do not fire on a
      # line it should run, that the codec corpus decodes and encodes, and that
      # the runtime workload opens sockets and reports — on both runners, in
      # Debug, where the numbers mean nothing. No figure is compared against
      # anything. A threshold needs a per-machine baseline this workflow cannot
      # calibrate, and a threshold that fires on a busy runner reports the
      # runner rather than the code; the measurement belongs to a developer who
      # sized it on the machine it will be read on.
      - name: zig build run-bench (bounded smoke)
        run: zig build run-bench -- --mode all --iterations 4 --samples 3

      - name: zig build docs
        run: zig build docs
